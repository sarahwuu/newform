# ── What roles to match ──────────────────────────────────────────────
# A job alerts only if its title matches an include keyword, matches no
# exclude keyword, and passes the level check below.
keywords:
  include:
    - product design
    - product designer
    - ux design
    - ui design
    - ui/ux
    - ux/ui
    - ui & ux
    - user experience
    - user research
    - ux research
    - design research
    - interaction design
    - visual design
    - brand design
    - communication design
    - graphic design
    - digital design
    - web design
    - designer
    - design intern
    - design co-op
  # Filters out hardware/EE "design engineer" roles and other false positives
  exclude:
    - engineer
    - engineering
    - verification
    - asic
    - analog
    - circuit
    - silicon
    - hardware
    - mechanical
    - electrical
    - dram
    - rtl
    - cad
    - fpga
    - physical design
    - reliability
    - layout design
    - architect
    - developer

# Roles with these words in the title are skipped (too senior)
seniority_exclude:
  - senior
  - staff
  - principal
  - lead
  - manager
  - director
  - head of
  - vp of
  - chief
  - "sr."
  - "sr "

# Only alert on intern / new-grad level roles. Set require: false to also
# get unmarked "Product Designer" roles (more coverage, more noise).
level:
  require: true
  include:
    - intern
    - internship
    - co-op
    - coop
    - new grad
    - new college grad
    - university grad
    - college grad
    - early career
    - entry level
    - entry-level
    - junior
    - apprentice
    - apprenticeship
    - fellow
    - campus
    - student
    - "2026"
    - "2027"

# ── Alert behavior ───────────────────────────────────────────────────
alerts:
  # On the very first run there's a backlog of hundreds of matches.
  # Only the newest N are alerted; the rest are marked seen silently.
  first_run_alert_limit: 25

# ── Sources ──────────────────────────────────────────────────────────
sources:
  # SimplifyJobs community lists — updated within minutes of new postings
  github_lists:
    enabled: true
    urls:
      - https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/.github/scripts/listings.json
      - https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json

  # Direct ATS board polling — catches postings before they hit LinkedIn.
  # Add/remove company slugs freely; unknown slugs are skipped gracefully.
  # Find a company's slug in its careers page URL, e.g.
  #   job-boards.greenhouse.io/<slug>   jobs.lever.co/<slug>   jobs.ashbyhq.com/<slug>
  greenhouse:
    enabled: true
    companies:
      - figma
      - duolingo
      - discord
      - stripe
      - airbnb
      - pinterest
      - robinhood
      - gusto
      - webflow
      - canva
      - grammarly
      - dropbox
      - asana
      - squarespace
      - reddit
      - coursera
      - chime
      - brex
      - affirm
      - airtable
      - notion
      - vercel
      - datadog
      - roblox
      - niantic
      - strava

  lever:
    enabled: true
    companies:
      - spotify
      - plaid
      - palantir
      - attentive
      - mistral

  ashby:
    enabled: true
    companies:
      - ramp
      - linear
      - openai
      - replit
      - deel
      - mercury
      - vanta
      - warp
      - clay
      - cursor

  # LinkedIn public job search (no login). Occasionally rate-limited;
  # failures are logged and skipped, never fatal.
  linkedin:
    enabled: true
    location: United States
    hours_back: 24
    queries:
      - product design intern
      - ux design intern
      - ui ux intern
      - user research intern
      - ux research intern
      - product designer new grad
      - junior product designer
      - design co-op
