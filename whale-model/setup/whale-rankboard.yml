name: Whale watch

on:
  schedule:
    - cron: "*/15 * * * *"   # fast loop: hunt for signals every ~15 min
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: whale-db          # repo-wide: never let two runs touch the cache at once
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r whale-model/requirements.txt

      - name: Restore whale database
        uses: actions/cache/restore@v4
        with:
          path: whale-model/data/polywhale.db
          key: whale-db-${{ github.run_id }}
          restore-keys: |
            whale-db-

      # Once a day (09:00 UTC) do the heavy maintenance; every other run is the
      # light, fast hunt so signals surface within ~15 minutes.
      - name: Decide run type
        id: mode
        run: |
          H=$(date -u +%H)
          if [ "$H" = "09" ]; then echo "heavy=true" >> "$GITHUB_OUTPUT";
          else echo "heavy=false" >> "$GITHUB_OUTPUT"; fi

      - name: Quick ingest (every run)
        working-directory: whale-model
        run: python -m polywhale --db data/polywhale.db ingest --pages 15 --quick

      - name: Daily backfill (heavy run only)
        if: steps.mode.outputs.heavy == 'true'
        working-directory: whale-model
        run: python -m polywhale --db data/polywhale.db backfill --max-age-days 14

      - name: Hunt for signature hits (files an issue on new ones)
        id: hunt
        working-directory: whale-model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m polywhale --db data/polywhale.db hunt | tee hunt_out.txt
          NEW=$(grep -oE '[0-9]+ new paper bets' hunt_out.txt | grep -oE '[0-9]+' || echo 0)
          echo "new=${NEW:-0}" >> "$GITHUB_OUTPUT"
          if [ "${NEW:-0}" -gt 0 ]; then
            {
              echo "@sarahwuu — the whale model found ${NEW} new insider-signature hit(s):"
              echo
              echo '```'
              cat hunt_out.txt
              echo '```'
              echo
              echo "Tag meaning: [NEWS] = the actionable category; [SPORTS] = watch only"
              echo "(likely fixing/team-news, often voided, resolves too fast to act)."
              echo "Before acting: check the live price has not run past the whale's entry,"
              echo "and read the market's resolution rules on Polymarket."
            } > issue_body.md
            gh issue create \
              --title "Whale signal: ${NEW} new insider-signature hit(s)" \
              --body-file issue_body.md
          fi

      - name: Direct email alert (optional)
        if: vars.ALERT_EMAIL != '' && steps.hunt.outputs.new != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Whale signal: ${{ steps.hunt.outputs.new }} new insider-signature hit(s)"
          to: ${{ vars.ALERT_EMAIL }}
          from: Whale Model <${{ secrets.MAIL_USERNAME }}>
          body: file://whale-model/issue_body.md

      - name: Grade ledger and rebuild board (heavy run only)
        if: steps.mode.outputs.heavy == 'true'
        working-directory: whale-model
        run: |
          python -m polywhale --db data/polywhale.db ledger --out LEDGER.md
          python -m polywhale --db data/polywhale.db report --top 10 \
            --out-md RANKBOARD.md --out-html ../docs/index.html

      - name: Save whale database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: whale-model/data/polywhale.db
          key: whale-db-${{ github.run_id }}

      - name: Commit board and ledger (heavy run only)
        if: steps.mode.outputs.heavy == 'true'
        run: |
          git config user.name "whale-rankboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whale-model/RANKBOARD.md whale-model/LEDGER.md docs/index.html
          git commit -m "Whale board update" || echo "no changes to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
