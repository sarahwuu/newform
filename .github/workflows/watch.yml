name: Watch for new design roles

on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07 (off-peak minute — top-of-hour crons get delayed most)
  workflow_dispatch: {}       # lets you trigger a scan manually from the Actions tab

concurrency:
  group: job-watch
  cancel-in-progress: false

permissions:
  contents: write   # commit seen-jobs state + drafts back to the repo
  issues: write     # fallback alert channel before SMTP is configured

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan job sources
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent.main

      - name: Commit state and drafts
        run: |
          git config user.name "job-watch-bot"
          git config user.email "actions@github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: record scan results $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
